name: RoundTimer
options:
  bundleIdPrefix: com.roundtimer
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "26"
  minimumXcodeGenVersion: "2.38"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: JVZFL2WCHV
    CODE_SIGN_STYLE: Automatic

targets:
  RoundTimer:
    type: application
    platform: iOS
    sources:
      - path: RoundTimer
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.roundtimer.app
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "RoundTimer"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSSupportsLiveActivities: true
    dependencies:
      - target: RoundTimerWidgetExtension

  RoundTimerWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: RoundTimerWidgetExtension
      - path: RoundTimer/Models/TimerPhase.swift
      - path: RoundTimer/Models/SoundEvent.swift
      - path: RoundTimer/LiveActivity/TimerActivityAttributes.swift
    info:
      path: RoundTimerWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: "RoundTimer Widget"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: com.roundtimer.app.widget
    entitlements:
      path: RoundTimerWidgetExtension/RoundTimerWidgetExtension.entitlements
      properties: {}

  RoundTimerWatch:
    type: application
    platform: watchOS
    sources:
      - path: RoundTimerWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.roundtimer.app.watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.roundtimer.app
        INFOPLIST_KEY_CFBundleDisplayName: "RoundTimer"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
